name: Starlight Agent Launchpad

on:
  pull_request:
    paths:
      - "templates/starlight-agent-launchpad/**"
      - ".github/workflows/starlight-agent-launchpad.yml"
  push:
    branches: [main]
    paths:
      - "templates/starlight-agent-launchpad/**"
      - ".github/workflows/starlight-agent-launchpad.yml"

permissions:
  contents: read

concurrency:
  group: launchpad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: templates/starlight-agent-launchpad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: templates/starlight-agent-launchpad/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
